name: ساخت APK اندروید

# با هر بار آپلود روی شاخهٔ main (یا اجرای دستی از تب Actions) آزمون‌ها اجرا می‌شوند
# و فایل APK ساخته می‌شود. APK را از پایین صفحهٔ همان اجرا، بخش Artifacts، دانلود کنید.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  tests:
    name: آزمون‌ها
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: اجرای آزمون‌های منطق بازی و متن فارسی
        run: python -m unittest discover -s tests -v

  apk:
    name: ساخت APK
    needs: tests
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # نسخه‌های پایتون و Cython عمداً ثابت شده‌اند؛ pygame با Python 3.12+ و Cython 3 روی اندروید ساخته نمی‌شود.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: نصب بسته‌های سیستمی
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip build-essential ccache autoconf automake libtool libltdl-dev \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev

      - name: نصب Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "cython==0.29.36" buildozer virtualenv setuptools wheel

      - name: بازیابی حافظهٔ نهان (ساخت‌های بعدی سریع‌تر می‌شود)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: ساخت APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: بارگذاری APK
        uses: actions/upload-artifact@v4
        with:
          name: kharg-defense-apk
          path: bin/*.apk
          if-no-files-found: error

      # اگر ساخت خطا داد، گزارش کامل برای بررسی در همین‌جا ذخیره می‌شود
      - name: بارگذاری گزارش ساخت (فقط هنگام خطا)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
